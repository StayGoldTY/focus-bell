<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="FocusBell - 基于神经科学的专注训练">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FocusBell">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>FocusBell</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #ECEAF4;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1C1B1F; }
    }
  </style>

  <script>
    // === Web Audio API ===
    var _fbAudioCtx = null;
    var _fbAudioUnlocked = false;

    function _ensureAudioCtx() {
      if (!_fbAudioCtx || _fbAudioCtx.state === 'closed') {
        _fbAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (_fbAudioCtx.state === 'suspended') {
        _fbAudioCtx.resume();
      }
      return _fbAudioCtx;
    }

    // Browsers require AudioContext creation/resume during a user gesture.
    // Pre-initialize on first interaction so later timer-triggered calls work.
    ['click', 'touchstart', 'keydown'].forEach(function(evt) {
      document.addEventListener(evt, function unlock() {
        _ensureAudioCtx();
        _fbAudioUnlocked = true;
        document.removeEventListener(evt, unlock);
      }, { once: true });
    });

    function playFocusBellPattern(frequency, duration, volume, texture, pulseCount) {
      try {
        var ctx = _ensureAudioCtx();
        var now = ctx.currentTime;
        var safeVol = Math.max(volume, 0.001);
        var safeTexture = texture || 'digital';
        var safePulseCount = Math.max(1, pulseCount || 1);

        function makeOsc(freq, vol, type, startAt, length) {
          var osc = ctx.createOscillator();
          osc.type = type || 'sine';
          osc.frequency.setValueAtTime(freq, startAt);
          var g = ctx.createGain();
          g.gain.setValueAtTime(Math.max(vol, 0.001), startAt);
          g.gain.exponentialRampToValueAtTime(0.001, startAt + length);
          osc.connect(g);
          g.connect(ctx.destination);
          osc.start(startAt);
          osc.stop(startAt + length + 0.05);
        }

        var pulseGap = Math.max(0.14, duration / (safePulseCount + 1.8));
        for (var index = 0; index < safePulseCount; index++) {
          var startAt = now + index * pulseGap;
          var gainScale = Math.max(0.55, 1 - index * 0.12);
          switch (safeTexture) {
            case 'bowl':
              makeOsc(frequency, safeVol * 0.9 * gainScale, 'sine', startAt, duration * 0.95);
              makeOsc(frequency * 2.02, safeVol * 0.32 * gainScale, 'triangle', startAt, duration * 0.9);
              break;
            case 'chime':
              makeOsc(frequency, safeVol * 0.75 * gainScale, 'triangle', startAt, duration * 0.8);
              makeOsc(frequency * 3, safeVol * 0.18 * gainScale, 'sine', startAt, duration * 0.7);
              break;
            case 'wood':
              makeOsc(frequency * 0.78, safeVol * 0.8 * gainScale, 'triangle', startAt, duration * 0.45);
              makeOsc(2100, safeVol * 0.05 * gainScale, 'square', startAt, duration * 0.12);
              break;
            case 'water':
              makeOsc(frequency, safeVol * 0.72 * gainScale, 'sine', startAt, duration * 0.55);
              makeOsc(frequency * 2.2, safeVol * 0.12 * gainScale, 'sine', startAt, duration * 0.45);
              break;
            case 'pulse':
              makeOsc(frequency, safeVol * 0.72 * gainScale, 'square', startAt, duration * 0.32);
              makeOsc(frequency * 2, safeVol * 0.16 * gainScale, 'sine', startAt, duration * 0.28);
              break;
            case 'breath':
              makeOsc(frequency, safeVol * 0.55 * gainScale, 'sine', startAt, duration * 0.95);
              makeOsc(frequency * 0.5, safeVol * 0.12 * gainScale, 'triangle', startAt, duration * 0.75);
              break;
            case 'crystal':
              makeOsc(frequency, safeVol * 0.62 * gainScale, 'sine', startAt, duration * 0.85);
              makeOsc(frequency * 2.7, safeVol * 0.18 * gainScale, 'triangle', startAt, duration * 0.7);
              makeOsc(frequency * 5.1, safeVol * 0.08 * gainScale, 'sine', startAt, duration * 0.6);
              break;
            case 'harp':
              makeOsc(frequency, safeVol * 0.72 * gainScale, 'triangle', startAt, duration * 0.65);
              makeOsc(frequency * 2, safeVol * 0.16 * gainScale, 'sine', startAt, duration * 0.4);
              break;
            default:
              makeOsc(frequency, safeVol * gainScale, 'sine', startAt, duration * 0.5);
              makeOsc(frequency * 2, safeVol * 0.25 * gainScale, 'triangle', startAt, duration * 0.4);
              break;
          }
        }
      } catch (e) {
        console.warn('playFocusBellPattern error:', e);
      }
    }

    // === Wake Lock API ===
    var _fbWakeLock = null;
    var _fbWakeLockDesired = false;

    async function requestFocusWakeLock() {
      _fbWakeLockDesired = true;
      try {
        if ('wakeLock' in navigator) {
          _fbWakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function releaseFocusWakeLock() {
      _fbWakeLockDesired = false;
      try {
        if (_fbWakeLock) {
          _fbWakeLock.release();
          _fbWakeLock = null;
        }
      } catch (e) {}
    }

    // Re-acquire wake lock when page becomes visible (browser releases it on hide)
    document.addEventListener('visibilitychange', async function() {
      if (document.visibilityState === 'visible' && _fbWakeLockDesired) {
        try {
          if ('wakeLock' in navigator) {
            _fbWakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (e) {}
      }
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
