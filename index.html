  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #ECEAF4;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #1C1B1F; }
    }
  </style>

  <script src="focus_audio.js"></script>
  <script>
    // === Wake Lock API ===
    var _fbWakeLock = null;
    var _fbWakeLockDesired = false;

    async function requestFocusWakeLock() {
      _fbWakeLockDesired = true;
      try {
        if ('wakeLock' in navigator) {
          _fbWakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function releaseFocusWakeLock() {
      _fbWakeLockDesired = false;
      try {
        if (_fbWakeLock) {
          _fbWakeLock.release();
          _fbWakeLock = null;
        }
      } catch (e) {}
    }

    // Re-acquire wake lock when page becomes visible (browser releases it on hide)
    document.addEventListener('visibilitychange', async function() {
      if (document.visibilityState === 'visible' && _fbWakeLockDesired) {
        try {
          if ('wakeLock' in navigator) {
            _fbWakeLock = await navigator.wakeLock.request('screen');
          }
        } catch (e) {}
      }
    });
  </script>
</head>

  <script src="flutter_bootstrap.js" async></script>
